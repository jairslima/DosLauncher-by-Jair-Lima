# dos-vm.conf
# Configuracao do DOSBox-X para C:\dos by Jair Lima.
# Monta a pasta C:\dos inteira como unidade C: e roda o AUTOEXEC.BAT
# real dela (SHARE.EXE, SMARTDRV, PATH), reproduzindo o ambiente DOS
# original (jogos, Clipper/dBASE, Norton Commander, Windows 3.1).
#
# As demais secoes nao listadas aqui usam os padroes do DOSBox-X
# (dosbox-x.conf ao lado do executavel): CPU, som (Sound Blaster/Adlib),
# video VGA, etc.

[sdl]
fullscreen=false

[dosbox]
title=DOS by Jair Lima

[autoexec]
@echo off
mount c C:\dos
c:
autoexec.bat
cls
echo.
echo ============================================
echo   DOS by Jair Lima - C:\dos montado como C:
echo   Pastas: Games, Utilitarios, Aplicativos, Clipper
echo   Exemplo: cd Games\doom  ^&^&  doom
echo ============================================
echo.
